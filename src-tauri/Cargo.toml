[package]
name = "kuro-cat-pet"
version = "5.1.1"
description = "Lightweight colored-pencil desktop pet for 拿铁 (Latte)"
authors = ["Kevin Hao"]
edition = "2021"

[lib]
name = "kuro_cat_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "KuroCat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSGraphics", "NSScreen", "NSWindow"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString", "CFUUID"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSGeometry", "NSString", "NSValue"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
